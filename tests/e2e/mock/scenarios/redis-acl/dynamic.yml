http:
  routers:
    r:
      rule: "PathPrefix(`/foo`)"
      entryPoints:
        - web
      service: backend
      middlewares:
        - bouncer
  services:
    backend:
      loadBalancer:
        servers:
          - url: "@@BACKEND_URL@@"
  middlewares:
    bouncer:
      plugin:
        bouncer:
          enabled: "true"
          crowdsecMode: live
          crowdsecLapiScheme: http
          crowdsecLapiHost: "@@LAPI_HOST@@"
          crowdsecLapiKey: "@@APIKEY@@"
          redisCacheEnabled: "true"
          redisCacheHost: "@@ACL_REDIS_HOST@@"
          redisCacheUsername: "crowdsec"
          redisCachePassword: "fixture password%value"
          redisCacheKeyPrefix: "crowdsec:"
          redisCacheDatabase: "5"
          forwardedHeadersTrustedIps:
            - "127.0.0.1/32"
